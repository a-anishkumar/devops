<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BOLTflix Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #141414;
      color: white;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      z-index: 1000;
    }

    .logo {
      color: #e50914;
      font-size: 32px;
      font-weight: bold;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
    }

    /* Hero Section */
    .hero {
      height: 90vh;
      background: url("https://images.unsplash.com/photo-1524985069026-dd778a71c7b4") center/cover no-repeat;
      display: flex;
      align-items: center;
      padding-left: 60px;
    }

    .hero-content {
      max-width: 500px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .buttons button {
      padding: 10px 25px;
      margin-right: 10px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    .play {
      background: white;
      color: black;
    }

    .info {
      background: rgba(109,109,110,0.7);
      color: white;
    }

    /* Movie Row */
    .row {
      padding: 20px 50px;
    }

    .row h2 {
      margin-bottom: 10px;
    }

    .row-posters {
      display: flex;
      overflow-x: auto;
      gap: 10px;
    }

    .row-posters img {
      width: 200px;
      border-radius: 4px;
      transition: transform 0.3s;
      cursor: pointer;
    }

    .row-posters img:hover {
      transform: scale(1.1);
    }

    .row-posters::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">NETFLIX</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">TV Shows</a>
      <a href="#">Movies</a>
      <a href="#">My List</a>
    </div>
  </div>

  <!-- Hero Section -->
  <div class="hero">
    <div class="hero-content">
      <h1>Stranger Things</h1>
      <p>
        When a young boy disappears, his mother and friends must confront
        terrifying supernatural forces.
      </p>
      <div class="buttons">
        <button class="play">▶ Play</button>
        <button class="info">ℹ More Info</button>
      </div>
    </div>
  </div>

  <!-- Movie Rows -->
  <div class="row">
    <h2>Trending Now</h2>
    <div class="row-posters">
      <img src="https://via.placeholder.com/200x300?text=Movie+1">
      <img src="https://via.placeholder.com/200x300?text=Movie+2">
      <img src="https://via.placeholder.com/200x300?text=Movie+3">
      <img src="https://via.placeholder.com/200x300?text=Movie+4">
      <img src="https://via.placeholder.com/200x300?text=Movie+5">
    </div>
  </div>

</body>
</html>
